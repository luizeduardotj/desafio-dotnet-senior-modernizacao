name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  legado:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # global.json fixa o SDK 10, que também compila net8.0; o 8.0 fica para o runtime dos testes
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build (net48 + net8.0)
        run: dotnet build legado/NotaCarioca.sln -c Release
      - name: Testes unitarios (net8.0)
        run: dotnet test legado/tests/NotaCarioca.Testes -c Release -f net8.0 --no-build

  moderno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build (analyzers, warnings como erro)
        run: dotnet build Nfse.Moderno.slnx -c Release
      - name: Testes unitarios e de arquitetura
        run: dotnet test Nfse.Moderno.slnx -c Release --no-build

  compose:
    # Ambiente completo do zero (Oracle real com a carga do legado e o NFSE_MODERNO) e smoke test pela fachada.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build das imagens (legado, fachada, serviço novo)
        run: docker compose build
      - name: Sobe o ambiente e espera todos saudáveis
        run: docker compose up -d --wait --wait-timeout 1800
      - name: Smoke test (health e ConsultarNfse igual ao legado)
        run: tools/smoke-compose.sh
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Paridade (golden master das leituras e sombra do cancelamento contra o Oracle do compose)
        env:
          NFSE_PARIDADE_ORACLE: "User Id=NFSE_MODERNO_APP;Password=moderno_app_dev_123;Data Source=127.0.0.1:1521/FREEPDB1"
          NFSE_PARIDADE_ORACLE_RO: "User Id=NFSE_MODERNO_RO;Password=moderno_ro_dev_123;Data Source=127.0.0.1:1521/FREEPDB1"
        run: dotnet test tests/Nfse.Paridade.Testes -c Release
      - name: Estado e logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 300
      - name: Derruba
        if: always()
        run: docker compose down -v

  manifests:
    # Valida os overlays de deploy/k8s contra os schemas do Kubernetes e dos CRDs (Argo Rollouts, External Secrets, OpenFeature).
    # Não precisa de cluster. Binários com versão e SHA-256 fixos; o schema dos CRDs vem do datreeio/CRDs-catalog.
    runs-on: ubuntu-latest
    env:
      KUBECTL_VERSION: v1.36.1
      KUBECTL_SHA256: 629d3f410e09bf49b64ae7079f7f0bda1191efed311f7d37fdbab0ad5b0ec2b7
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      CRD_CATALOG: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
    steps:
      - uses: actions/checkout@v4
      - name: Instala kubectl (kustomize embutido) e kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  $RUNNER_TEMP/bin/kubectl" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/kubectl"
          curl -fsSLo "$RUNNER_TEMP/kubeconform.tar.gz" "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: kubeconform (overlay local)
        run: kubectl kustomize deploy/k8s/overlays/local | kubeconform -strict -summary -schema-location default -schema-location "$CRD_CATALOG" -
      - name: kubeconform (overlay producao)
        run: kubectl kustomize deploy/k8s/overlays/producao | kubeconform -strict -summary -schema-location default -schema-location "$CRD_CATALOG" -
