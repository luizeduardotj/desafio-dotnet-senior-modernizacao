name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  legado:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # global.json fixa o SDK 10, que também compila net8.0; o 8.0 fica para o runtime dos testes
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build (net48 + net8.0)
        run: dotnet build legado/NotaCarioca.sln -c Release
      - name: Testes unitarios (net8.0)
        run: dotnet test legado/tests/NotaCarioca.Testes -c Release -f net8.0 --no-build

  moderno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build (analyzers, warnings como erro)
        run: dotnet build Nfse.Moderno.slnx -c Release
      - name: Testes unitarios e de arquitetura
        run: dotnet test Nfse.Moderno.slnx -c Release --no-build --filter "Categoria!=Contrato"
      - name: Testes de contrato (OpenAPI e SOAP)
        # snapshot do /openapi/v1.json e forma das respostas SOAP contra tools/exemplos; regenerar: NFSE_ATUALIZAR_CONTRATO=1
        run: dotnet test Nfse.Moderno.slnx -c Release --no-build --filter "Categoria=Contrato"

  compose:
    # Ambiente completo do zero (Oracle real com a carga do legado e o NFSE_MODERNO) e smoke test pela fachada.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build das imagens (legado, fachada, serviço novo)
        run: docker compose build
      - name: Sobe o ambiente e espera todos saudáveis
        run: docker compose up -d --wait --wait-timeout 1800
      - name: Smoke test (health e ConsultarNfse igual ao legado)
        run: tools/smoke-compose.sh
      - name: Massa de teste da paridade (C11, C13, C15; só INSERT de linhas novas, idempotente)
        # Prestador 31 e cinco notas que nenhum outro caso lê (tests/paridade/massa); a linha de base é seed + massa.
        run: tests/paridade/massa-de-teste.sh
      - name: Golden master ainda descreve o legado (leituras recapturadas direto no legado, git diff vazio)
        # Antes de qualquer escrita no banco. Os casos 2xx mudam o estado e ficam com o step do FIXED_DATE.
        run: tests/paridade/recapturar-leituras-legado.sh
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Paridade e garantias do banco (leituras, sombra do cancelamento e grants contra o Oracle do compose)
        env:
          NFSE_PARIDADE_ORACLE: "User Id=NFSE_MODERNO_APP;Password=moderno_app_dev_123;Data Source=127.0.0.1:1521/FREEPDB1"
          NFSE_PARIDADE_ORACLE_RO: "User Id=NFSE_MODERNO_RO;Password=moderno_ro_dev_123;Data Source=127.0.0.1:1521/FREEPDB1"
        run: dotnet test tests/Nfse.Paridade.Testes -c Release
      - name: Paridade do cancelamento (FIXED_DATE)
        # Cancela notas do seed: roda depois das leituras, que não veem o banco alterado; o job termina com down -v.
        # O script congela o SYSDATE como SYS no PDB e devolve FIXED_DATE = NONE ao sair, passe ou falhe.
        env:
          NFSE_PARIDADE_ORACLE: "User Id=NFSE_MODERNO_APP;Password=moderno_app_dev_123;Data Source=127.0.0.1:1521/FREEPDB1"
        run: tests/paridade/cancelamento-fixed-date.sh
      - name: K08 corrigido pelo wrapper (dois cancelamentos paralelos, um UPDATE)
        # Escreve: cancela a nota 27/5 com o relógio real (prazo aberto no mês da carga).
        # Depois do cancelamento com FIXED_DATE: o snapshot do caso 209 (prestador 27) foi capturado sem este cancelamento.
        env:
          NFSE_PARIDADE_ORACLE: "User Id=NFSE_MODERNO_APP;Password=moderno_app_dev_123;Data Source=127.0.0.1:1521/FREEPDB1"
          NFSE_PARIDADE_K08: "1"
        run: dotnet test tests/Nfse.Paridade.Testes -c Release --no-build --filter "FullyQualifiedName~Nfse.Paridade.Testes.GarantiaK08Tests"
      - name: Leituras conferidas de novo (as escritas acima não mudaram o golden master)
        env:
          NFSE_PARIDADE_ORACLE: "User Id=NFSE_MODERNO_APP;Password=moderno_app_dev_123;Data Source=127.0.0.1:1521/FREEPDB1"
        run: dotnet test tests/Nfse.Paridade.Testes -c Release --no-build --filter "FullyQualifiedName~Nfse.Paridade.Testes.ParidadeLeiturasTests"
      - name: Estado e logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 300
      - name: Derruba
        if: always()
        run: docker compose down -v

  oracle-21c:
    # Opcional, só manual: o job compose sobre Oracle XE 21c, a versão gratuita mais próxima do 19c de produção
    # (docs/spikes/2026-10-20-oracle-xe21.md). Mede o quanto a entrega depende do 23ai; não bloqueia PR.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_ARGS: -p nfse-xe21 -f docker-compose.yml -f tests/oracle-21c/docker-compose.xe21.yml
      NFSE_ORACLE_PDB: XEPDB1
    steps:
      - uses: actions/checkout@v4
      - name: Build das imagens (legado, fachada, serviço novo)
        run: docker compose $COMPOSE_ARGS build
      - name: Sobe o ambiente sobre o XE 21c e espera todos saudáveis
        run: docker compose $COMPOSE_ARGS up -d --wait --wait-timeout 2400
      - name: Connection strings (porta aleatória do Oracle no host)
        run: |
          porta="$(docker compose $COMPOSE_ARGS port oracle 1521)"
          echo "NFSE_PARIDADE_ORACLE=User Id=NFSE_MODERNO_APP;Password=moderno_app_dev_123;Data Source=${porta}/XEPDB1" >> "$GITHUB_ENV"
          echo "NFSE_PARIDADE_ORACLE_RO=User Id=NFSE_MODERNO_RO;Password=moderno_ro_dev_123;Data Source=${porta}/XEPDB1" >> "$GITHUB_ENV"
      - name: Smoke test
        run: tools/smoke-compose.sh
      - name: Massa de teste da paridade (C11, C13, C15)
        run: tests/paridade/massa-de-teste.sh
      - name: Golden master das leituras recapturado no legado
        run: tests/paridade/recapturar-leituras-legado.sh
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Paridade e garantias do banco
        run: dotnet test tests/Nfse.Paridade.Testes -c Release
      - name: Paridade do cancelamento (FIXED_DATE no XEPDB1)
        run: tests/paridade/cancelamento-fixed-date.sh
      - name: K08 corrigido pelo wrapper
        # Depois do FIXED_DATE, como no job compose: a nota 27/5 do K08 está na competência que o caso 209 compara.
        env:
          NFSE_PARIDADE_K08: "1"
        run: dotnet test tests/Nfse.Paridade.Testes -c Release --no-build --filter "FullyQualifiedName~Nfse.Paridade.Testes.GarantiaK08Tests"
      - name: Leituras conferidas de novo
        run: dotnet test tests/Nfse.Paridade.Testes -c Release --no-build --filter "FullyQualifiedName~Nfse.Paridade.Testes.ParidadeLeiturasTests"
      - name: Estado e logs
        if: failure()
        run: |
          docker compose $COMPOSE_ARGS ps -a
          docker compose $COMPOSE_ARGS logs --no-color --tail 300
      - name: Derruba
        if: always()
        run: docker compose $COMPOSE_ARGS down -v

  resiliencia:
    # Oracle lento ou fora do ar só para o serviço novo (Toxiproxy), pela fachada: fallback das leituras, Fault do
    # cancelamento sem escrita dupla, sombra fora do caminho do cliente e recuperação sem restart. Job à parte para não
    # alongar o compose; sobe o próprio ambiente do zero (tests/resiliencia/README.md).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Resiliência (sobe, testa e derruba)
        run: tests/resiliencia/rodar.sh
      - name: Medições no resumo do job
        if: always()
        run: |
          if [ -f TestResults/resiliencia-medicoes.md ]; then
            { echo "### Resiliência: tempos medidos"; echo; cat TestResults/resiliencia-medicoes.md; } >> "$GITHUB_STEP_SUMMARY"
          fi

  manifests:
    # Valida os overlays de deploy/k8s contra os schemas do Kubernetes e dos CRDs (Argo Rollouts, External Secrets, OpenFeature).
    # Não precisa de cluster. Binários com versão e SHA-256 fixos; o schema dos CRDs vem do datreeio/CRDs-catalog.
    runs-on: ubuntu-latest
    env:
      KUBECTL_VERSION: v1.36.1
      KUBECTL_SHA256: 629d3f410e09bf49b64ae7079f7f0bda1191efed311f7d37fdbab0ad5b0ec2b7
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      CRD_CATALOG: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
    steps:
      - uses: actions/checkout@v4
      - name: Instala kubectl (kustomize embutido) e kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  $RUNNER_TEMP/bin/kubectl" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/kubectl"
          curl -fsSLo "$RUNNER_TEMP/kubeconform.tar.gz" "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: kubeconform (overlay local)
        run: kubectl kustomize deploy/k8s/overlays/local | kubeconform -strict -summary -schema-location default -schema-location "$CRD_CATALOG" -
      - name: kubeconform (overlay producao)
        run: kubectl kustomize deploy/k8s/overlays/producao | kubeconform -strict -summary -schema-location default -schema-location "$CRD_CATALOG" -
