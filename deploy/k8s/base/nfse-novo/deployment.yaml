apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfse-novo
spec:
  # Sem "replicas": quem manda é o HPA (min 2). Declarar aqui faria cada apply brigar com ele.
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: nfse-novo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nfse-novo
    spec:
      serviceAccountName: nfse-novo
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nfse-novo
          matchLabelKeys:
            - pod-template-hash
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nfse-novo
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: nfse-novo
          image: nfse-novo
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            # Avaliação da sombra do cancelamento; a NetworkPolicy só deixa a fachada chegar aqui.
            - name: interno
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: nfse-novo-config
          env:
            # Dois usuários (ADR-0002, db/moderno): _APP escreve só pelo PKG_CANCELAMENTO_API;
            # _RO atende a sombra, que nunca escreve.
            - name: ConnectionStrings__NfseModernoApp
              valueFrom:
                secretKeyRef:
                  name: nfse-novo-oracle
                  key: app
            - name: ConnectionStrings__NfseModernoRo
              valueFrom:
                secretKeyRef:
                  name: nfse-novo-oracle
                  key: ro
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=nfse,deployment.environment.name=$(NFSE_AMBIENTE),k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME)
          # A primeira conexão ao Oracle (pool + ODP.NET) pode levar segundos; o startup segura a liveness.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # /health/ready deve checar o Oracle (pool com sessão válida). Liveness NÃO checa o banco:
          # Oracle lento reiniciando todos os pods só piora o incidente.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # Valores [H]: calibrar no teste de carga (k6, legado x novo). O HPA escala por CPU sobre o request.
          resources:
            requests:
              cpu: 500m
              memory: 384Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
