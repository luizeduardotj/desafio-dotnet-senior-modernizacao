# Entrada do serviço novo:
#  - 8080: SOAP só da fachada; REST /api/v1 do ingress controller;
#  - 8081 (interna): POST /interno/sombra/cancelamento só da fachada (ADR-0009, seção 3).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nfse-novo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nfse-novo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fachada
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fachada
      ports:
        - port: 8081
          protocol: TCP
