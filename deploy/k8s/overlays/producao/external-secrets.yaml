# Segredos de produção vêm do cofre (ADR-0012: nunca em appsettings nem no repositório).
# O ClusterSecretStore "cofre-nfse" e os caminhos são da plataforma; os nomes aqui são o contrato.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fachada-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cofre-nfse
  target:
    name: fachada-admin
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: nfse/fachada
        property: admin-token
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nfse-novo-oracle
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cofre-nfse
  target:
    name: nfse-novo-oracle
    creationPolicy: Owner
  data:
    # Connection strings completas de NFSE_MODERNO_APP e NFSE_MODERNO_RO (db/moderno/01_usuarios.sql).
    - secretKey: app
      remoteRef:
        key: nfse/oracle
        property: connection-string-app
    - secretKey: ro
      remoteRef:
        key: nfse/oracle
        property: connection-string-ro
