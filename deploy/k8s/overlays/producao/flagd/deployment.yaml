apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagd
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: flagd
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flagd
    spec:
      serviceAccountName: flagd
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: flagd
      containers:
        - name: flagd
          image: flagd
          args:
            - start
            - --uri
            - core.openfeature.dev/nfse/nfse-migracao
            - --port
            - "8013"
            - --management-port
            - "8014"
            - --sync-port
            - "8015"
          ports:
            - name: avaliacao
              containerPort: 8013
            - name: gestao
              containerPort: 8014
            - name: sync
              containerPort: 8015
          readinessProbe:
            httpGet:
              path: /readyz
              port: gestao
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: gestao
            periodSeconds: 10
          # [H]: o conjunto de flags é minúsculo; calibrar se o número de conexões de sync crescer.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
