# 8013: avaliação (RPC). 8015: sync, consumido pela fachada (provider OpenFeature em modo in-process,
# que avalia na própria fachada, sem RPC por requisição).
apiVersion: v1
kind: Service
metadata:
  name: flagd
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flagd
  ports:
    - name: avaliacao
      port: 8013
      targetPort: avaliacao
    - name: sync
      port: 8015
      targetPort: sync
